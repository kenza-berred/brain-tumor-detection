# Continuous integration: lint + unit tests for the API, lint + build for the frontend,
# and a check that the DVC pipeline graph is valid.
name: CI - tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff — flake8 rules, import order, bugbear)
        run: ruff check .
      - name: Format check (ruff format, black-compatible)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -v

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build
        run: npm run build

  pipeline:
    name: Training code & DVC pipeline — lint and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dvc>=3.50" ruff
      - name: Lint the training code (ruff)
        run: ruff check src && ruff format --check src
      - name: Check the pipeline graph
        run: dvc dag
