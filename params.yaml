# Hyperparameters — read by src/train.py and tracked by DVC.
# Change a value, run `dvc repro`, and compare the runs in MLflow.

data:
  url: https://github.com/ultralytics/assets/releases/download/v0.0.0/brain-tumor.zip
  md5: d4409053d0a850b2a8036383b8cbac26   # archive version of 2026-11-15 (1 class, 994 train / 121 val)
  dir: data/brain-tumor

train:
  model: yolo11n.pt      # yolo11n.pt (fast) or yolo11s.pt (more accurate)
  epochs: 50
  imgsz: 640
  batch: 8
  workers: 0             # dataloader processes (keep low on Windows)
  patience: 15           # early stopping
  seed: 42
  augment: true          # false = disable mosaic/mixup/hsv augmentations (for comparison)
  device: ""              # "" = auto (GPU if available), "cpu", or "0"

export:
  imgsz: 640
  opset: 12
  simplify: true
  calibration_images: 100   # training images used to calibrate the INT8 model
  benchmark_images: 30      # validation images timed for the CPU latency benchmark

mlflow:
  experiment: brain-tumor-detection
  registered_model: brain-tumor-detector
